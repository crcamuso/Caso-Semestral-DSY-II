<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios — Panel administrador Gas El Volcán</title>
<link rel="stylesheet" href="../css/estilos.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="panel-admin">
  <button class="boton-menu-admin" id="boton-menu-admin">☰ Menú</button>
  <aside class="panel-lateral" id="panel-lateral">
    <div class="marca-admin">
      <svg class="llama" viewBox="0 0 24 24"><path d="M12 2c-1 3-4 4-4 8a4 4 0 0 0 8 0c0-1-1-2-1-2 1 2 3 3 3 6a6 6 0 0 1-12 0c0-5 3-6 4-9 0 2 1 3 2 3 0-2 0-4 0-6z"/></svg>
      Panel admin
    </div>
    <nav>
      <a href="index.html" class="">🏠 Dashboard</a>
      <a href="productos.html" class="">📦 Productos</a>
      <a href="usuarios.html" id="enlace-usuarios" class="activo">👤 Usuarios</a>
      <a href="../index.html">🛒 Ver tienda</a>
    </nav>
    <div class="sesion-usuario">
      <strong id="nombre-sesion">Usuario</strong>
      <span id="rol-sesion">Rol</span><br>
      <button class="salir" id="boton-salir">Cerrar sesión</button>
    </div>
  </aside>
  <main class="panel-contenido">


<div class="panel-encabezado">
  <h1>Usuarios</h1>
  <a href="usuario-form.html" class="boton boton--llama">+ Nuevo usuario</a>
</div>
<div class="tarjeta-panel">
  <div class="tabla-responsiva">
    <table class="tabla-simple">
      <thead><tr><th>RUN</th><th>Nombre</th><th>Correo</th><th>Tipo de usuario</th><th>Comuna</th><th>Acciones</th></tr></thead>
      <tbody id="tabla-usuarios"></tbody>
    </table>
  </div>
</div>

  </main>
</div>

<script src="../js/datos-productos.js"></script>
<script src="../js/datos-usuarios.js"></script>
<script src="../js/datos-regiones.js"></script>
<script src="../js/validaciones.js"></script>
<script src="js/admin-comun.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function(){
    if (!SESION_ADMIN) return;
    exigirRolAdministrador();

    function pintar(){
      const usuarios = obtenerUsuarios();
      document.getElementById("tabla-usuarios").innerHTML = usuarios.map(function(u){
        return `<tr>
          <td>${u.run}</td>
          <td>${u.nombre} ${u.apellidos || ""}</td>
          <td>${u.correo}</td>
          <td>${u.tipoUsuario}</td>
          <td>${u.comuna || "-"}</td>
          <td class="acciones-fila">
            <a href="usuario-form.html?run=${u.run}" class="boton boton--contorno boton--pequeno">Editar</a>
            <button type="button" class="boton boton--pequeno" style="background:var(--rojo-alerta);color:#fff;" data-eliminar="${u.run}">Eliminar</button>
          </td>
        </tr>`;
      }).join("");

      document.querySelectorAll("[data-eliminar]").forEach(btn => btn.addEventListener("click", function(){
        if (this.dataset.eliminar === SESION_ADMIN.correo) { return; }
        if (confirm("¿Eliminar al usuario " + this.dataset.eliminar + "?")){
          eliminarUsuario(this.dataset.eliminar);
          pintar();
        }
      }));
    }
    pintar();
  });
</script>

</body>
</html>
